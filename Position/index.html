<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
    }

    .container {
        position: relative;
        width: 300px;
        height: 300px;
        background-color: #e0e0e0;
        margin: 50px;
        border: 2px solid #333;
    }

    .box {
        width: 100px;
        height: 100px;
        border-radius: 5px;
        background-color: #3498db;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .relative-box {
        position: relative;
        top: 20px;
        left: 20px;
        background-color: #2ecc71;
    }

    .absolute-box {
        position: absolute;
        top: 0px;
        right: 0px;
        background-color: #e74c3c;
    }
</style>

<div class="container">
    <div class="box relative-box">Relative</div>
    <div class="box absolute-box">Absolute</div>
</div>
